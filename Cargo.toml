[package]
name = "gameboy-learn-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "gameboy_learn_rs"
path = "src/main.rs"
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
rust-gb = { path = "../rust-gb/crates/gb/", features = ["cgb"] }

[profile.release]
opt-level = "s"
lto = "fat"
